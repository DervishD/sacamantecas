[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools==80.9.0",
    "versioningit==3.3.0"
]

[dependency-groups]
dev = [
    {include-group="freeze"},
    {include-group="tests"},
    {include-group="lint"},
]
freeze = [
    "pyinstaller==6.19.0",
]
tests = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
]
lint = [
    "pylint",
    "pylint-pytest",
    "vulture",
    "ruff",
]

[project]
name = "sacamantecas"
dynamic = ["version"]
description = "Saca las mantecas…"
readme = "README.md"
requires-python = ">= 3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="Raúl Núñez de Arenas Coronado", email="raulnac@gmail.com"}]
maintainers = [{name="Raúl Núñez de Arenas Coronado", email="raulnac@gmail.com"}]
dependencies = [
    "legion",
    "openpyxl==3.1.3",
]

[project.urls]
source = "https://github.com/DervishD/sacamantecas"
issues = "https://github.com/DervishD/sacamantecas/issues"

[tool.versioningit.format]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D210", "D213"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
order-by-type = false

[tool.coverage.run]
branch = true
omit = [
    "build.py"
]

[tool.coverage.report]
show_missing = true
skip_empty = true
format = "markdown"
precision = 2