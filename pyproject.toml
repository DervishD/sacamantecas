[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools==80.9.0",
    "versioningit==3.3.0"
]

[dependency-groups]
dev = [
    {include-group="freeze"},
    {include-group="tests"},
    {include-group="lint"},
]
freeze = [
    "pyinstaller==6.19.0",
]
tests = [
    "pytest==9.0.2",
]
lint = [
    "pylint",
    "vulture",
    "ruff",
]

[project]
name = "sacamantecas"
dynamic = ["version"]
description = "Saca las mantecas…"
readme = "README.md"
requires-python = ">= 3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="Raúl Núñez de Arenas Coronado", email="raulnac@gmail.com"}]
maintainers = [{name="Raúl Núñez de Arenas Coronado", email="raulnac@gmail.com"}]
dependencies = [
    "openpyxl==3.1.3",
]

[project.urls]
source = "https://github.com/DervishD/sacamantecas"
issues = "https://github.com/DervishD/sacamantecas/issues"

[tool.versioningit.format]
dirty = "{base_version}+{rev}.dirty"
distance = "{next_version}.post{distance}+{rev}"
distance-dirty = "{next_version}.post{distance}+{rev}.dirty"